name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: |
          pip install numpy setuptools wheel
          python setup.py sdist
      - name: Build a wheel FROM the sdist (the provenance check)
        run: |
          pip install numpy setuptools wheel
          pip wheel dist/*.tar.gz --no-deps -w wheel-from-sdist/
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheel-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build manylinux x86_64 wheels (cp39-cp312, manylinux)
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse .
        env:
          CIBW_BUILD: "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64"
          CIBW_BEFORE_BUILD: "pip install numpy setuptools"
          CIBW_TEST_COMMAND: "python -c \"import ratec; t=ratec.RateC(c=20); d=b'cookbook wheel smoke '*100; i=t.encode_bytes(d); assert t.decode_bytes(i)==d; print('wheel smoke OK', ratec.__version__)\""
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-x86_64
          path: wheelhouse/*.whl

  wheel-aarch64:
    # manylinux aarch64 on GitHub's arm64 runners — the same C sources,
    # the same stable-ABI tags; the aarch64 CI job (ci.yml) already
    # proves the full gate suite green on this architecture
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build manylinux aarch64 wheels
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse .
        env:
          CIBW_BUILD: "cp39-manylinux_aarch64 cp310-manylinux_aarch64 cp311-manylinux_aarch64 cp312-manylinux_aarch64"
          CIBW_BEFORE_BUILD: "pip install numpy setuptools"
          CIBW_TEST_COMMAND: "python -c \"import ratec; t=ratec.RateC(c=20); d=b'cookbook wheel smoke '*100; i=t.encode_bytes(d); assert t.decode_bytes(i)==d; print('wheel smoke OK', ratec.__version__)\""
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-aarch64
          path: wheelhouse/*.whl

  release:
    needs: [sdist, wheel-x86_64, wheel-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
